  <text x="92" y="122" fill="#7FB7E8" font-family="Arial, sans-serif" font-size="18" font-weight="700">Trade Capture</text>
  <text x="352" y="122" fill="#D7E6F5" font-family="Arial, sans-serif" font-size="28" font-weight="700">Book, inspect, and amend trades</text>
  <text x="352" y="148" fill="#84A3BE" font-family="Arial, sans-serif" font-size="15">Blotter and ticket entry stay side by side so you can verify the current state before changing it.</text>

  <rect x="94" y="164" width="176" height="14" rx="7" fill="#19374B"/>
  <rect x="94" y="198" width="176" height="56" rx="14" fill="#163245"/>
