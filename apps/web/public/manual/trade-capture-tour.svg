  <rect x="94" y="342" width="176" height="56" rx="14" fill="#163245"/>
  <rect x="94" y="414" width="176" height="56" rx="14" fill="#163245"/>
  <rect x="94" y="486" width="176" height="56" rx="14" fill="#163245"/>

  <text x="354" y="228" fill="#7FB7E8" font-family="Arial, sans-serif" font-size="17" font-weight="700">Live blotter</text>
  <rect x="354" y="248" width="460" height="42" rx="10" fill="#163245"/>
  <rect x="354" y="302" width="460" height="42" rx="10" fill="#153649"/>
