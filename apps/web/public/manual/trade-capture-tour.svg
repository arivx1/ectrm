  <text x="890" y="228" fill="#7FB7E8" font-family="Arial, sans-serif" font-size="17" font-weight="700">Ticket and inspector</text>
  <rect x="890" y="252" width="144" height="18" rx="9" fill="#26A17B"/>
  <rect x="890" y="288" width="296" height="52" rx="12" fill="#17384C"/>
  <rect x="890" y="354" width="296" height="52" rx="12" fill="#17384C"/>
  <rect x="890" y="420" width="296" height="52" rx="12" fill="#17384C"/>
  <rect x="890" y="486" width="296" height="52" rx="12" fill="#17384C"/>
  <rect x="890" y="566" width="140" height="34" rx="17" fill="#26A17B"/>
  <rect x="1046" y="566" width="140" height="34" rx="17" fill="#1B3345"/>

  <circle cx="270" cy="224" r="22" fill="#26A17B"/>
  <text x="262" y="231" fill="#07111B" font-family="Arial, sans-serif" font-size="18" font-weight="700">1</text>
  <path d="M292 224H334" stroke="#26A17B" stroke-width="4" stroke-linecap="round"/>
  <text x="344" y="214" fill="#E7F1FA" font-family="Arial, sans-serif" font-size="18" font-weight="700">Choose the trade from the blotter first</text>
  <text x="344" y="238" fill="#8BA8C2" font-family="Arial, sans-serif" font-size="15">Use the row list to anchor the ticket to the exact trade you want to inspect or amend.</text>

  <circle cx="842" cy="388" r="22" fill="#4EA7FF"/>
  <text x="834" y="395" fill="#07111B" font-family="Arial, sans-serif" font-size="18" font-weight="700">2</text>
  <path d="M864 388H904" stroke="#4EA7FF" stroke-width="4" stroke-linecap="round"/>
  <text x="914" y="378" fill="#E7F1FA" font-family="Arial, sans-serif" font-size="18" font-weight="700">Use the ticket to confirm economics</text>
  <text x="914" y="402" fill="#8BA8C2" font-family="Arial, sans-serif" font-size="15">Counterparty, pricing status, dates, and legs all live here before you save a change.</text>

  <circle cx="1038" cy="584" r="22" fill="#F2B84B"/>
  <text x="1030" y="591" fill="#07111B" font-family="Arial, sans-serif" font-size="18" font-weight="700">3</text>
  <path d="M1060 584H1120" stroke="#F2B84B" stroke-width="4" stroke-linecap="round"/>
  <text x="912" y="636" fill="#E7F1FA" font-family="Arial, sans-serif" font-size="18" font-weight="700">Save or pivot into follow-up tabs</text>
  <text x="912" y="660" fill="#8BA8C2" font-family="Arial, sans-serif" font-size="15">Once the trade looks right, amend it, review events, or hand the issue into downstream work.</text>
