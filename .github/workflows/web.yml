name: Web

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-build-test:
    name: Web Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: make web-install

      - name: Lint web app
        run: make web-lint

      - name: Build web app
        run: make web-build

      - name: Run web verification
        run: make web-test
